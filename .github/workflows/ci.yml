name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke test the CLI on the examples
        run: |
          kovamesh-verify check --spec examples/kovamesh.yaml
          kovamesh-verify check --spec examples/api.yaml
          python3 examples/demo_server.py 8765 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 1
          kovamesh-verify run --spec examples/kovamesh.yaml
          kovamesh-verify run --spec examples/api.yaml --format json
